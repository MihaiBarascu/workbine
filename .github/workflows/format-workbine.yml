name: Format Workbine feature

on:
  push:
    branches:
      - feature/workbine-experience
    paths:
      - .github/workflows/format-workbine.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/workbine-experience
          fetch-depth: 0

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Format
        run: |
          npm run check -- --fix
          composer lint

      - name: Commit formatting
        run: |
          git config user.name "Workbine CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: format Workbine experience"
          git push origin feature/workbine-experience
