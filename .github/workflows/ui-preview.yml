name: Public UI preview

# Local development uses tools/test-local.sh. Remote sessions explicitly dispatch
# or add run-remote-checks to a same-repository PR. Ordinary pushes never run tests.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: public-ui-preview-${{ inputs.ref || github.event.pull_request.number || github.ref }}-${{ github.event.label.name || 'manual' }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'run-remote-checks' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/workbine-preview.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: array
      MAIL_MAILER: array
      MEDIA_ENABLED: true
      MEDIA_DISK: public

    steps:
      - name: Checkout requested source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record tested revision
        run: |
          git rev-parse HEAD
          printf 'Tested source: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare PHP image support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, exif, intl, pdo_pgsql, zip
          coverage: none
          ini-values: memory_limit=256M, upload_max_filesize=5M, post_max_size=8M, max_file_uploads=2

      - name: Prepare isolated application
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          touch /tmp/workbine-preview.sqlite
          php artisan migrate --force --no-interaction
          npm ci
          php artisan wayfinder:generate --with-form --no-interaction
          npm run build

      - name: Add preview-only community content
        run: |
          php tools/seed-preview.php
          php artisan storage:link --no-interaction

      - name: Start preview server
        run: |
          php artisan serve --no-reload --host=127.0.0.1 --port=8000 > /tmp/workbine-preview-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/up > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/workbine-preview-server.log
          exit 1

      - name: Install preview browser outside application dependencies
        run: |
          npm install --prefix /tmp/workbine-browser --no-save --package-lock=false playwright@1.56.1
          node /tmp/workbine-browser/node_modules/playwright/cli.js install --with-deps chromium

      - name: Capture desktop, mobile, empty and dark states
        run: |
          node tests/browser/capture-public.cjs

      - name: Exercise real browser contribution and account flows
        run: |
          node tests/browser/community-flow.cjs
          node tests/browser/profile-flow.cjs
          node tests/browser/media-flow.cjs

      - name: Print isolated application diagnostics on failure
        if: failure()
        run: |
          tail -n 100 storage/logs/laravel.log || true
          tail -n 40 /tmp/workbine-preview-server.log || true

      - name: Upload review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbine-public-ui-preview
          path: /tmp/workbine-ui-preview/*.png
          if-no-files-found: warn
          retention-days: 7
