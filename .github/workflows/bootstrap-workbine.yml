name: bootstrap-workbine

# Explicit invocation only; never consume Actions minutes for ordinary pushes/PRs.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Workbine
        uses: actions/checkout@v7
        with:
          ref: chore/bootstrap-laravel
          fetch-depth: 0

      - name: Copy official Laravel React starter
        run: |
          git clone --depth 1 https://github.com/laravel/react-starter-kit.git /tmp/laravel-react-starter
          rsync -a \
            --exclude='.git' \
            --exclude='README.md' \
            --exclude='.github/workflows' \
            /tmp/laravel-react-starter/ ./

      - name: Configure Workbine defaults
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          env = Path('.env.example')
          text = env.read_text().replace('APP_NAME=Laravel', 'APP_NAME=Workbine')
          env.write_text(text)

          composer = Path('composer.json')
          data = json.loads(composer.read_text())
          data['name'] = 'mihaibarascu/workbine'
          data['description'] = 'Community-driven platform for methods validated by real-world experience.'
          composer.write_text(json.dumps(data, indent=4) + '\n')
          PY

      - name: Add Dokploy-friendly Docker runtime
        run: |
          mkdir -p docker

          cat > Dockerfile <<'EOF'
          FROM node:22-bookworm-slim AS node

          FROM php:8.3-apache-bookworm

          RUN apt-get update \
              && apt-get install -y --no-install-recommends \
                  libicu-dev \
                  libpq-dev \
                  libzip-dev \
                  unzip \
              && docker-php-ext-install -j"$(nproc)" bcmath intl opcache pdo_pgsql zip \
              && a2enmod rewrite \
              && rm -rf /var/lib/apt/lists/*

          COPY --from=composer:2 /usr/bin/composer /usr/bin/composer
          COPY --from=node /usr/local/bin/node /usr/local/bin/node
          COPY --from=node /usr/local/lib/node_modules /usr/local/lib/node_modules

          RUN ln -s /usr/local/lib/node_modules/npm/bin/npm-cli.js /usr/local/bin/npm \
              && ln -s /usr/local/lib/node_modules/npm/bin/npx-cli.js /usr/local/bin/npx

          WORKDIR /var/www/html
          COPY . .

          RUN composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader \
              && php artisan wayfinder:generate --with-form --no-interaction \
              && npm install \
              && npm run build \
              && rm -rf node_modules /usr/local/lib/node_modules /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx \
              && chown -R www-data:www-data storage bootstrap/cache

          COPY docker/apache-vhost.conf /etc/apache2/sites-available/000-default.conf
          COPY docker/entrypoint.sh /usr/local/bin/workbine-entrypoint
          RUN chmod +x /usr/local/bin/workbine-entrypoint

          EXPOSE 80

          HEALTHCHECK --interval=30s --timeout=5s --start-period=20s --retries=3 \
              CMD php -r '$$c=@file_get_contents("http://127.0.0.1/up"); exit($$c===false ? 1 : 0);'

          ENTRYPOINT ["workbine-entrypoint"]
          CMD ["apache2-foreground"]
          EOF

          cat > docker/apache-vhost.conf <<'EOF'
          <VirtualHost *:80>
              ServerAdmin webmaster@localhost
              DocumentRoot /var/www/html/public

              <Directory /var/www/html/public>
                  AllowOverride All
                  Require all granted
              </Directory>

              ErrorLog ${APACHE_LOG_DIR}/error.log
              CustomLog ${APACHE_LOG_DIR}/access.log combined
          </VirtualHost>
          EOF

          cat > docker/entrypoint.sh <<'EOF'
          #!/bin/sh
          set -e

          php artisan migrate --force
          php artisan optimize

          exec "$@"
          EOF

          cat > .dockerignore <<'EOF'
          .git
          .github
          .env
          .env.*
          !.env.example
          node_modules
          vendor
          public/build
          storage/logs/*
          README.md
          EOF

      - name: Install and validate application
        run: |
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
          php artisan key:generate
          npm install
          npm run build
          composer ci:check

      - name: Keep Workbine product README
        run: |
          cat > README.md <<'EOF'
          # Workbine

          Workbine is a community-driven platform for discovering how people actually do things in practice.

          A person can create a goal such as `How to build a SaaS with Gemini`, publish their own method, and explain exactly how they did it. Other people can publish alternative methods, validate what they tried, show evidence, thank creators, and build reputation by helping others.

          ## Core idea

          `Goal -> Methods -> Real experiences -> Evidence -> Current reputation`

          The product prioritizes practical experience, freshness, credibility, and helpfulness over simple popularity.

          ## Stack

          Laravel 13 + React 19 + Inertia 3 + TypeScript + PostgreSQL.

          Production uses PostgreSQL through environment variables. Local setup and CI keep Laravel's lightweight SQLite defaults.

          The application is intentionally kept as a single deployable monolith for fast product iteration. A Dockerfile and `/up` health check are included for Dokploy deployment.
          EOF

      - name: Commit scaffold
        run: |
          rm -f .env
          git config user.name "Workbine Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize Laravel 13 React application"
          git push origin chore/bootstrap-laravel
