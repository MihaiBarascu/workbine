name: Design source audit (temporary)

on:
  push:
    branches: [feat/community-design-and-profiles]
    paths: ['.github/workflows/design-source-review.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export tracked source only for this requested review
        run: git archive --format=tar.gz --output=/tmp/workbine-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: internal-source-review
          path: /tmp/workbine-source.tar.gz
          retention-days: 1
