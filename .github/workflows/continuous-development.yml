name: Workbine development every 3 hours

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-development.yml'
      - 'tools/autodev.py'
      - 'docs/AUTODEV_TASKS.json'

permissions:
  contents: read

concurrency:
  group: workbine-continuous-development
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'MihaiBarascu/workbine' && vars.WORKBINE_AUTODEV_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      copilot-requests: write
    outputs:
      ready: ${{ steps.agent.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Check deterministic scope guards
        run: python3 -m unittest discover -s tools -p 'test_autodev.py' -v
      - name: Install pinned agent outside the application
        run: npm install --prefix /tmp/workbine-agent --no-save --package-lock=false @github/copilot@1.0.83
      - name: Generate one bounded improvement or resume pending publication
        id: agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_BIN: /tmp/workbine-agent/node_modules/.bin/copilot
          COPILOT_HOME: /tmp/workbine-copilot-home
        run: python3 tools/autodev.py generate
      - name: Format with trusted locked tools and revalidate the proposal
        if: steps.agent.outputs.ready == 'true'
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          npm ci
          php artisan wayfinder:generate --with-form --no-interaction
          npm run check:fix
          git diff --check
          python3 tools/autodev.py package
      - name: Transfer only the bounded proposal to the deterministic publisher
        if: steps.agent.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autodev-proposal
          path: /tmp/autodev-proposal.json
          retention-days: 3

  publish-branch:
    needs: propose
    if: needs.propose.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    outputs:
      head: ${{ steps.publish.outputs.head }}
      main: ${{ steps.publish.outputs.main }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: autodev-proposal
          path: /tmp/proposal
      - name: Validate again and publish to a feature branch only
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/autodev.py publish

  ci:
    needs: publish-branch
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.publish-branch.outputs.head }}
    permissions:
      contents: read

  browser:
    needs: publish-branch
    uses: ./.github/workflows/ui-preview.yml
    with:
      ref: ${{ needs.publish-branch.outputs.head }}
    permissions:
      contents: read

  release:
    needs: [publish-branch, ci, browser]
    if: needs.ci.result == 'success' && needs.browser.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Open a PR and merge only the exact validated safe UI increment
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_HEAD: ${{ needs.publish-branch.outputs.head }}
          APPROVED_MAIN: ${{ needs.publish-branch.outputs.main }}
          AUTO_MERGE: ${{ vars.WORKBINE_AUTODEV_AUTO_MERGE != 'false' && 'true' || 'false' }}
        run: python3 tools/autodev.py release
