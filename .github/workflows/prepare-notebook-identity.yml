name: Prepare notebook identity (temporary)

on:
  push:
    branches: [feat/notebook-identity]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply the scoped identity integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('resources/js/pages/topics/index.tsx')
          text = path.read_text().replace('function useStarter(', 'function chooseStarter(').replace('useStarter(title)', 'chooseStarter(title)')
          path.write_text(text)
          path = Path('app/Http/Controllers/TopicController.php')
          text = path.read_text()
          old = "    public function create(): Response\n    {\n        return Inertia::render('topics/create');\n    }"
          new = "    public function create(Request $request): Response\n    {\n        $title = $request->query('title', '');\n\n        return Inertia::render('topics/create', [\n            'initialTitle' => is_string($title) ? Str::limit(Str::squish($title), 160, '') : '',\n        ]);\n    }"
          if old in text:
              text = text.replace(old, new)
          else:
              assert "'initialTitle'" in text
          path.write_text(text)
          path = Path('resources/js/pages/topics/create.tsx')
          text = path.read_text()
          if 'initialTitle' not in text:
              assert 'export default function TopicCreate() {' in text
              text = text.replace('export default function TopicCreate() {', 'type Props = { initialTitle: string };\n\nexport default function TopicCreate({ initialTitle }: Props) {')
              text = text.replace('name="title"', 'name="title"\n                                    defaultValue={initialTitle}', 1)
          path.write_text(text)
          for name in ['resources/js/pages/topics/show.tsx', 'resources/js/pages/experiences/index.tsx']:
              path = Path(name)
              text = path.read_text()
              for old, new in [('text-teal-700', 'text-primary'), ('text-teal-300', 'text-primary'), ('bg-teal-50/50', 'bg-muted/50'), ('bg-teal-950/20', 'bg-muted/50'), ('bg-teal-50', 'bg-secondary'), ('bg-teal-950', 'bg-secondary'), ('text-teal-900', 'text-secondary-foreground'), ('text-teal-100', 'text-secondary-foreground')]:
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Install the locked development tools and format the changed source
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          npm ci
          php artisan wayfinder:generate --with-form --no-interaction
          npm run check:fix
          vendor/bin/pint --parallel
          git diff --check
          git add resources/css/workbine.css resources/js/components/public-shell.tsx resources/js/pages/topics/index.tsx resources/js/pages/topics/create.tsx resources/js/pages/topics/show.tsx resources/js/pages/experiences/index.tsx app/Http/Controllers/TopicController.php tests/Feature/TopicDraftTest.php
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Workbine development bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate the notebook identity and preserve question drafts through login'
          git push origin HEAD:refs/heads/feat/notebook-identity
