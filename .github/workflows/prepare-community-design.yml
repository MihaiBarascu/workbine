name: Prepare community screens (temporary)

on:
  push:
    branches: [feat/community-design-and-profiles]
    paths: ['.github/workflows/prepare-community-design.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Apply the manually authored light-theme refinement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math, re, struct, zlib
          p = Path('resources/css/app.css')
          s = p.read_text()
          light = {'background':'#f8f9fb','foreground':'#242730','card':'#ffffff','card-foreground':'#242730','popover':'#ffffff','popover-foreground':'#242730','primary':'#315ed7','primary-foreground':'#ffffff','secondary':'#f1f3f7','secondary-foreground':'#454d5e','muted':'#f1f3f6','muted-foreground':'#626b7c','accent':'#eef3ff','accent-foreground':'#2d54bd','destructive':'#b42318','destructive-foreground':'#b42318','border':'#e3e7ee','input':'#cbd2de','ring':'#315ed7','chart-1':'#315ed7','chart-2':'#6889e3','chart-3':'#39455f','chart-4':'#9aacd8','chart-5':'#8490a8'}
          dark = {'background':'#16181d','foreground':'#edf0f5','card':'#1f2229','card-foreground':'#edf0f5','popover':'#232730','popover-foreground':'#edf0f5','primary':'#adc3ff','primary-foreground':'#15223f','secondary':'#2b2f39','secondary-foreground':'#dce1ed','muted':'#272b34','muted-foreground':'#b0b7c6','accent':'#29334c','accent-foreground':'#bccdff','destructive':'#96392f','destructive-foreground':'#ffb4aa','border':'#383e4b','input':'#555e70','ring':'#adc3ff','chart-1':'#adc3ff','chart-2':'#6889e3','chart-3':'#d2dcf5','chart-4':'#9aacd8','chart-5':'#8490a8'}
          for selector, values in [(':root', light), ('.dark', dark)]:
              match = re.search(re.escape(selector) + r' \{.*?\n\}', s, re.S)
              assert match
              block = match[0]
              for key, value in values.items():
                  block, count = re.subn(r'(--' + re.escape(key) + r': )[^;]+;', lambda m: m[1] + value + ';', block)
                  assert count == 1, key
              s = s[:match.start()] + block + s[match.end():]
          p.write_text(s)
          p = Path('resources/css/workbine.css')
          s = p.read_text().replace('--wb-rust', '--wb-link').replace('--wb-link: #a04a32;', '--wb-link: var(--primary);')
          s = s.replace('.dark .wb-public {\n    --wb-link: #edb294;\n}\n', '')
          for old, new in {'#d5ddd4':'#dce1e9','#f5f7f3':'#f8f9fb','#d6dfd2':'#d8dfe9','#657e62':'#7890c9','#1e2821':'#20242d','#455848':'#424a5b','#445546':'#434d61','#aec5a6':'#aebfe7'}.items():
              s = s.replace(old, new)
          s = s.replace('background: linear-gradient(90deg, #f8f9fb 50%, #20242d 50%);', 'background: #f8f9fb;\n    box-shadow: inset -70px 0 #20242d;')
          s = s.replace('.wb-profile-cover {\n    height: 128px;', '.wb-profile-cover {\n    height: 100px;')
          s += '\n.wb-public form[inert] { opacity: 0.65; }\n.wb-public input::placeholder, .wb-public textarea::placeholder { color: var(--muted-foreground); opacity: 1; }\n.wb-public .wb-compose-row input, .wb-public .wb-search input { font-size: 14px; }\n'
          p.write_text(s)
          for p in Path('resources/js/pages/auth').glob('*.tsx'):
              s = p.read_text().replace('text-green-600', 'text-primary')
              s = s.replace('<div className="mb-4 text-center text-sm font-medium text-primary">', '<div role="status" className="mb-4 text-center text-sm font-medium text-primary">')
              s = s.replace('className="bg-background text-muted-foreground px-2"', 'className="bg-card text-muted-foreground px-2"')
              p.write_text(s)
          p = Path('routes/web.php')
          s = p.read_text()
          if 'members.show' not in s:
              s = s.replace('use App\\Http\\Controllers\\MethodController;', 'use App\\Http\\Controllers\\MemberController;\nuse App\\Http\\Controllers\\MethodController;')
              s = s.replace("Route::get('topics', [TopicController::class, 'index'])->name('topics.index');", "Route::get('topics', [TopicController::class, 'index'])->name('topics.index');\nRoute::get('members/{user}', [MemberController::class, 'show'])->whereNumber('user')->name('members.show');")
          p.write_text(s)
          Path('public/favicon.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#ffffff"/><path d="M7 12l8 24 9-21 9 21 8-24M10 24h28" fill="none" stroke="#315ed7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>\n')
          # Raster versions of the existing W mark; no new library or external asset.
          segments = [(7,12,15,36),(15,36,24,15),(24,15,33,36),(33,36,41,12),(10,24,38,24)]
          def distance(x,y,a,b,c,d):
              t = max(0, min(1, ((x-a)*(c-a)+(y-b)*(d-b))/((c-a)**2+(d-b)**2)))
              return math.hypot(x-a-t*(c-a), y-b-t*(d-b))
          def chunk(tag, data):
              return struct.pack('!I', len(data)) + tag + data + struct.pack('!I', zlib.crc32(tag+data) & 0xffffffff)
          def png(size):
              rows = bytearray()
              for y in range(size):
                  rows.append(0)
                  for x in range(size):
                      coverage = sum(min(distance((x+dx)*48/size,(y+dy)*48/size,*seg) for seg in segments) <= 1.5 for dx,dy in [(0.25,0.25),(0.75,0.25),(0.25,0.75),(0.75,0.75)])/4
                      rows.extend(round(255*(1-coverage)+v*coverage) for v in (49,94,215))
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR',struct.pack('!IIBBBBB',size,size,8,2,0,0,0)) + chunk(b'IDAT',zlib.compress(bytes(rows))) + chunk(b'IEND',b'')
          Path('public/apple-touch-icon.png').write_bytes(png(180))
          data = png(48)
          Path('public/favicon.ico').write_bytes(struct.pack('<HHH',0,1,1)+struct.pack('<BBBBHHII',48,48,0,0,1,24,len(data),22)+data)
          p = Path('resources/views/app.blade.php')
          s = p.read_text().replace('href="/favicon.ico"','href="/favicon.ico?v=workbine-light"').replace('href="/favicon.svg"','href="/favicon.svg?v=workbine-light"').replace('href="/apple-touch-icon.png"','href="/apple-touch-icon.png?v=workbine-light"')
          s = s.replace("config('app.name', 'Laravel')", "config('app.name', 'Workbine')").replace('background-color: oklch(1 0 0);','background-color: #f8f9fb;').replace('background-color: oklch(0.145 0 0);','background-color: #16181d;')
          p.write_text(s)
          p = Path('tests/browser/profile-flow.cjs')
          s = p.read_text()
          old = '        await page.screenshot({\n            path: `${output}/${name}.png`,'
          new = '''        const tokens = await page.evaluate(() => {
                      const style = getComputedStyle(document.documentElement);
                      return { dark: document.documentElement.classList.contains('dark'), background: style.getPropertyValue('--background').trim(), primary: style.getPropertyValue('--primary').trim() };
                  });
                  assert.equal(tokens.background, tokens.dark ? '#16181d' : '#f8f9fb', name + ' neutral canvas');
                  assert.equal(tokens.primary, tokens.dark ? '#adc3ff' : '#315ed7', name + ' consistent blue accent');
                  await page.waitForFunction(() => document.querySelectorAll('[data-sonner-toast]').length === 0);
                  await page.screenshot({
                      path: `${output}/${name}.png`,'''
          assert old in s
          p.write_text(s.replace(old,new))
          PY
      - name: Install locked tools and format the reviewed source
        run: |
          mkdir -p /tmp/workbine-review
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          npm ci
          php artisan wayfinder:generate --with-form --no-interaction
          npm run check:fix > /tmp/workbine-review/formatting.txt 2>&1
          vendor/bin/pint --parallel >> /tmp/workbine-review/formatting.txt 2>&1
          git diff --check
      - name: Commit to this feature branch only
        run: |
          git add resources public routes tests
          git config user.name 'Workbine source preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: unify all screens with white surfaces and a restrained blue accent'
          git push origin HEAD:refs/heads/feat/community-design-and-profiles
          git archive --format=tar.gz --output=/tmp/workbine-review/formatted-source.tar.gz HEAD
      - name: Export internal source and diagnostics for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-light-source
          path: /tmp/workbine-review/
          retention-days: 1
          if-no-files-found: warn
