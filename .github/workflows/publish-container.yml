name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "Publishing $image"

      - name: Set up QEMU for ARM64 validation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image once
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Workbine
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull the exact published artifact by digest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker pull --platform linux/arm64 "$IMAGE@$DIGEST"

      - name: Verify exact published artifact
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          docker run --rm --platform linux/arm64 \
            --entrypoint sh "$IMAGE@$DIGEST" -c '
              set -eu
              php --version
              node --version
              test -f bootstrap/ssr/app.js
              test -x /usr/local/bin/workbine-entrypoint
              test -f /etc/supervisor/conf.d/workbine.conf
              php artisan --version

              supervisord -n -c /etc/supervisor/conf.d/workbine.conf > /tmp/supervisord.log 2>&1 &
              supervisor_pid=$!

              cleanup() {
                kill -TERM "$supervisor_pid" >/dev/null 2>&1 || true
                wait "$supervisor_pid" >/dev/null 2>&1 || true
              }
              trap cleanup EXIT

              for attempt in $(seq 1 30); do
                if php artisan inertia:check-ssr >/dev/null 2>&1; then
                  exit 0
                fi

                if ! kill -0 "$supervisor_pid" 2>/dev/null; then
                  cat /tmp/supervisord.log
                  exit 1
                fi

                sleep 1
              done

              cat /tmp/supervisord.log
              exit 1
            '

      - name: Record immutable release artifact
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Workbine release artifact"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Architecture: \`linux/arm64\`"
            echo "- Immutable tag: \`${IMAGE}:${GITHUB_SHA}\`"
            echo "- Convenience tag: \`${IMAGE}:main\`"
            echo "- Digest: \`${DIGEST}\`"
            echo
            echo "Production deployment is intentionally not triggered by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
