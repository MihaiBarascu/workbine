name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workbine_ci
          POSTGRES_USER: workbine_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbine_ci -d workbine_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'workbine_ci' }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: workbine_ci
      DB_PASSWORD: ci-only-password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          npm ci
          php artisan wayfinder:generate --with-form --no-interaction

      - name: Build frontend
        run: npm run build

      - name: Run quality checks and tests
        run: composer ci:check

      - name: Collect formatting and test diagnostics on failure
        if: failure()
        run: |
          mkdir -p /tmp/workbine-formatting
          npm run check:fix > /tmp/workbine-formatting/diagnostics.txt 2>&1 || true
          vendor/bin/pint --parallel >> /tmp/workbine-formatting/diagnostics.txt 2>&1 || true
          composer types:check >> /tmp/workbine-formatting/diagnostics.txt 2>&1 || true
          php artisan test >> /tmp/workbine-formatting/diagnostics.txt 2>&1 || true
          git diff -- resources/js resources/css app tests database routes > /tmp/workbine-formatting/formatting.patch
          git diff --name-only -- resources/js resources/css app tests database routes | while IFS= read -r path; do
            mkdir -p "/tmp/workbine-formatting/$(dirname "$path")"
            cp "$path" "/tmp/workbine-formatting/$path"
          done
          cat /tmp/workbine-formatting/diagnostics.txt

      - name: Upload formatting suggestions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formatting-${{ matrix.database }}
          path: /tmp/workbine-formatting/
          if-no-files-found: ignore
          retention-days: 3
