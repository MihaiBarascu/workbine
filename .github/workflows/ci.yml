name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          npm ci
          php artisan wayfinder:generate --with-form --no-interaction

      - name: Build frontend
        run: npm run build

      - name: Run quality checks and tests
        run: composer ci:check

      - name: Show formatting suggestions on failure
        if: failure()
        run: |
          npm run check:fix || true
          vendor/bin/pint --parallel || true
          git diff -- resources/js resources/css app tests
