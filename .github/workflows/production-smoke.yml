name: Production read-only smoke

# Explicit invocation only. Remote sessions may request the check by adding the
# verify-production label to a same-repository PR; ordinary pushes/PRs do nothing.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name || 'manual' }}
  cancel-in-progress: true

jobs:
  public-release:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'verify-production' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Checkout the release source to verify
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Record expected source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          printf 'Expected release source: `%s`\n' "$EXPECTED_SOURCE" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the production frontend fingerprint
        run: |
          docker build --tag workbine-release-fingerprint .
          container_id="$(docker create workbine-release-fingerprint)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/var/www/html/public/build/manifest.json" /tmp/expected-manifest.json

      - name: Verify the live release without writing production data
        run: |
          python3 tools/release_smoke.py \
            --base-url https://workbine.com \
            --manifest /tmp/expected-manifest.json \
            --expected-source "$EXPECTED_SOURCE" \
            --label 'Production read-only smoke'
