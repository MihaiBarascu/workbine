name: Production Smoke

on:
  push:
    branches:
      - chore/production-smoke
    paths:
      - .github/workflows/production-smoke.yml
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  smoke:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Check Workbine production
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location --max-time 15 \
            --user-agent "WorkbineProductionSmoke/1.0" \
            https://workbine.com/ \
            --output /tmp/workbine-home.html

          echo "workbine.com returned successfully."

          if grep -q 'topics/index' /tmp/workbine-home.html; then
            echo "Detected production component: topics/index"
            exit 0
          fi

          if grep -q 'goals/index' /tmp/workbine-home.html; then
            echo "Detected production component: goals/index (old deployment)"
            exit 1
          fi

          echo "Could not identify the Inertia root component."
          grep -oE '(goals|topics)[^&< ]{0,30}' /tmp/workbine-home.html | head -20 || true
          exit 1
