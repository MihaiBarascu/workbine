name: Production Smoke

on:
  push:
    branches:
      - chore/production-smoke
    paths:
      - .github/workflows/production-smoke.yml
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  smoke:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Workbine production
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            echo "Production check ${attempt}/30"

            if curl --fail --silent --show-error --location --max-time 15 \
              --user-agent "WorkbineProductionSmoke/1.0" \
              https://workbine.com/ \
              --output /tmp/workbine-home.html; then
              if grep -q 'topics/index' /tmp/workbine-home.html; then
                echo "Workbine production is healthy and serving the Topics experience."
                exit 0
              fi

              echo "Site responded, but the new Topics deployment is not live yet."
            else
              echo "Site is not reachable yet."
            fi

            sleep 10
          done

          echo "Production did not become ready within 5 minutes."
          echo "Last response preview:"
          head -c 1500 /tmp/workbine-home.html 2>/dev/null || true
          exit 1
