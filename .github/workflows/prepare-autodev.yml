name: Prepare bounded automation (temporary)

on:
  push:
    branches: [feat/three-hour-development]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Make the existing quality workflows reusable without weakening checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['.github/workflows/ci.yml', '.github/workflows/ui-preview.yml']:
              path = Path(name)
              text = path.read_text()
              if 'workflow_call:' not in text:
                  text = text.replace('  workflow_dispatch:\n', "  workflow_dispatch:\n  workflow_call:\n    inputs:\n      ref:\n        type: string\n        required: false\n        default: ''\n")
                  old = '$' + '{{ github.event.pull_request.number || github.ref }}'
                  new = '$' + '{{ inputs.ref || github.event.pull_request.number || github.ref }}'
                  text = text.replace(old, new)
                  ref = '$' + '{{ inputs.ref }}'
                  text = text.replace('        uses: actions/checkout@v7\n', '        uses: actions/checkout@v7\n        with:\n          ref: ' + ref + '\n          persist-credentials: false\n')
              if name.endswith('/ci.yml') and 'Check development-controller scope guards' not in text:
                  text = text.replace('      - name: Install PHP dependencies\n', "      - name: Check development-controller scope guards\n        run: python3 -m unittest discover -s tools -p 'test_autodev.py' -v\n\n      - name: Install PHP dependencies\n")
              path.write_text(text)
          path = Path('docs/STATUS.md')
          text = path.read_text().replace('A three-hour development workflow is being implemented separately.', 'The three-hour development workflow and its activation prerequisites are documented in docs/AUTOMATION.md.')
          path.write_text(text)
          PY
      - name: Validate and format using the existing locked tooling
        run: |
          python3 -m unittest discover -s tools -p 'test_autodev.py' -v
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          npm ci
          php artisan wayfinder:generate --with-form --no-interaction
          npm run check:fix
          git diff --check
          git add .github/workflows/ci.yml .github/workflows/ui-preview.yml docs/AUTODEV_TASKS.json docs/STATUS.md tools/autodev.py tools/test_autodev.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Workbine development bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: reuse the full database and browser gates for bounded development'
          git push origin HEAD:refs/heads/feat/three-hour-development
