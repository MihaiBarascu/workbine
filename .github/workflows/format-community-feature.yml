name: Format community feature (temporary)

on:
  push:
    branches:
      - feat/real-experiences-and-search

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'MihaiBarascu/workbine'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Install the locked development tools
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          npm ci
          php artisan wayfinder:generate --with-form --no-interaction
      - name: Apply repository formatters to the feature
        run: |
          npm run check:fix
          vendor/bin/pint --parallel
          git diff --check
          git add resources/js/components/copy-link-button.tsx resources/js/components/experience-form.tsx resources/js/pages/experiences/index.tsx resources/js/pages/topics/index.tsx resources/js/pages/topics/show.tsx tests/Feature/TopicSearchTest.php tests/browser/community-flow.cjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'Workbine formatting bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: apply repository formatters to community features'
          git push origin HEAD:refs/heads/feat/real-experiences-and-search
