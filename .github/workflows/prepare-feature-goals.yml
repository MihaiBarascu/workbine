name: prepare-feature-goals

on:
  push:
    branches:
      - feature/goals
    paths:
      - .github/workflows/prepare-feature-goals.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature
        uses: actions/checkout@v7
        with:
          ref: feature/goals
          fetch-depth: 0

      - name: Add Laravel Socialite
        run: composer require laravel/socialite:^5.29 --with-all-dependencies --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          npm install
          php artisan wayfinder:generate --with-form --no-interaction

      - name: Format application
        run: |
          npm run check -- --fix
          composer lint

      - name: Validate application
        run: |
          npm run build
          composer ci:check

      - name: Commit prepared feature
        run: |
          rm -f .env
          git config user.name "Workbine CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: format goals and add Socialite"
          git push origin feature/goals
