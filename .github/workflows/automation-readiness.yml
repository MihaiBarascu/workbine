name: Automation publication readiness

on:
  push:
    branches: [chore/automation-readiness]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-identity-review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Open or reuse the real identity pull request without merging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh pr list --repo MihaiBarascu/workbine --head feat/notebook-identity --state open --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo 'The identity pull request already exists; no duplicate created.'
            exit 0
          fi
          gh pr create --repo MihaiBarascu/workbine --base main --head feat/notebook-identity --draft --title 'Give Workbine a distinctive community-notebook identity' --body 'Implements the owner-requested move away from generic SaaS styling: a content-first notebook, original wordmark, paper/ink/terracotta palette, editorial navigation, question composer and clearly labeled starter prompts. Full CI, browser review and final cleanup are required before merge. This draft also verifies that the scheduled-development identity can publish a real review branch; it is not an automatic production deployment.'
